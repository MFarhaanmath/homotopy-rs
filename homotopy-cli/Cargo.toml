[package]
name = "homotopy-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "homotopy-cli"
path = "src/main.rs"

[[bin]]
name = "homotopy-agent"
path = "src/agent.rs"

[dependencies]
homotopy-common = { path = "../homotopy-common" }
homotopy-core = { path = "../homotopy-core" }
homotopy-model = { path = "../homotopy-model" }
anyhow = "1.0.86"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.118"
structopt = "0.3"